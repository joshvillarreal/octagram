[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octagram"
version = "0.1.0"
description = "Exhaustive Octagram board validation and deterministic board search"
requires-python = ">=3.11"
dependencies = ["wordfreq>=3.1,<4", "spylls>=0.1.7,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
octagram = "octagram.cli:main"

[tool.setuptools.packages.find]
include = ["octagram*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
